# Thinkfan config for Lenovo ThinkPad P14s Gen 5 (AMD Ryzen 7 PRO 8840HS)
#
# Sensors:
#   - k10temp: CPU die temperature (Tctl) — primary thermal reference
#   - thinkpad: EC-reported CPU temp
#   - amdgpu: Radeon 780M iGPU edge temperature
#   - nvme: SSD composite temperature
#
# Fan levels use simple mode — the highest temp across all sensors
# determines fan speed. The hysteresis gaps between lower/upper limits
# prevent rapid fan speed oscillation.

sensors:
  # CPU die temperature (most accurate for thermal throttling decisions)
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]

  # ThinkPad EC sensors — CPU and other board zones
  # indices 1=CPU, 3=zone2, 6=zone3, 7=zone4 (skip 2/GPU=N/A, 4=0, 5=N/A, 8=N/A)
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1, 3, 6, 7]

  # Radeon 780M iGPU
  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1]

  # NVMe SSD
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]

fans:
  # ThinkPad ACPI fan — supports levels 0-7, "auto", and "disengaged"
  - tpacpi: /proc/acpi/ibm/fan

# Simple mode: [SPEED, LOWER_LIMIT, UPPER_LIMIT]
# Uses the max temperature across all sensors.
#
# Fan curve rationale for 8840HS (Tjmax 100C):
#   - Off below 50C for silent desktop/idle use
#   - Low speeds for light loads
#   - Progressive ramp-up through medium loads
#   - Auto/BIOS control for sustained heavy loads
#   - Disengaged (full speed) as safety for extreme temps
levels:
  - [0,              0,  50]
  - ["level 1",     47,  55]
  - ["level 2",     52,  60]
  - ["level 3",     57,  65]
  - ["level 4",     62,  70]
  - ["level 5",     67,  75]
  - ["level 6",     72,  80]
  - ["level 7",     77,  85]
  - ["level disengaged", 83, 32767]
